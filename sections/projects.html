/* ==================== STAGE ==================== */

.pj-stage {
  position: relative;
  width: 100%;
  max-width: 860px;
  height: 280px;

  overflow: hidden;

.pj-stage::before,
.pj-stage::after {

/* ==================== TRACK ==================== */

.pj-track {

/* ==================== CARDS ==================== */

.pj-card {

  border-radius: 20px;

  opacity: 0.45;
  filter: saturate(0.4);
}

.pj-card::before {
  content: '';
  position: absolute;
  top: 0; left: 10%; right: 10%;
  height: 1.5px;

/* ==================== CONTROLS ==================== */

/* ==================== INFO ==================== */

.pj-info {

.pj-card.pj-active .pj-view-hint {

}

  position: absolute; bottom: 36px; left: 50%; transform: translateX(-50%);

/* ==================== RESPONSIVE ==================== */

@media (max-width: 700px) {

@media (prefers-reduced-motion: reduce) {
  .pj-track, .pj-card { transition: none !important; }

const N    = PROJECTS.length;
const GAP  = 24;

let active  = 0;   
let pos     = 0;   
let locked  = false;

const track  = document.getElementById('pj-track');
const dotsEl = document.getElementById('pj-dots');
const titleEl = document.getElementById('pj-title');
const descEl  = document.getElementById('pj-desc');
const tagsEl  = document.getElementById('pj-tags');

/* ==================== RENDER ==================== */

function cardW() {
  // read from first card so responsive CSS applies
  const c = track.querySelector('.pj-card');
  return c ? c.offsetWidth : 180;
}

function makeCard(p, realIdx) {
  const card = document.createElement('div');
  card.className = 'pj-card';
  card.dataset.real = realIdx;

  const imgSrc = p.images && p.images[0];
  const thumb  = imgSrc
    ? `<img src="${imgSrc}" alt="${p.title}" loading="lazy" ${p.logo ? 'class="pj-logo"' : ''}
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
       <div class="pj-thumb-fallback" style="display:none">${p.title}</div>`
    : `<div class="pj-thumb-fallback">${p.title}</div>`;

  const hasGallery = p.gallery && p.gallery.length;
  const hint = hasGallery ? `<div class="pj-view-hint">⊕ View screenshots</div>` : '';
  card.innerHTML = `<div class="pj-thumb">${thumb}</div><div class="pj-card-label">${p.title}</div>${hint}`;
  card.addEventListener('click', () => {
    const r = parseInt(card.dataset.real);
    if (r !== active && !locked) {
      const delta = r - active;
      const wrap  = N / 2;
      if (Math.abs(delta) <= wrap) {
        delta > 0 ? step(1) : step(-1);
      }
    } else if (r === active && PROJECTS[r].gallery && PROJECTS[r].gallery.length) {
      openGallery(PROJECTS[r]);
    }
  });
  return card;
}

function buildTrack() {
  track.innerHTML = '';

  // strip: [clone of last N] + [real 0..N-1] + [clone of first N]
  // This gives cards on both sides no matter where we are
  for (let i = 0; i < N; i++) track.appendChild(makeCard(PROJECTS[(N - N + i) % N], i));  // leading clone
  for (let i = 0; i < N; i++) track.appendChild(makeCard(PROJECTS[i], i));                 // real
  for (let i = 0; i < N; i++) track.appendChild(makeCard(PROJECTS[i], i));                 // trailing clone

  // total strip = 3*N cards, real block starts at index N
  pos = N + active;

  buildDots();
  requestAnimationFrame(() => {
    setTranslate(false);
    updateStyles();
  });
}

function buildDots() {
  dotsEl.innerHTML = '';
  PROJECTS.forEach((_, i) => {
    const d = document.createElement('button');
    d.className = 'pj-dot';
    d.setAttribute('aria-label', 'Project ' + (i + 1));
    d.addEventListener('click', () => { if (!locked) jumpTo(i); });
    dotsEl.appendChild(d);
  });
}

/* ==================== UTILS ==================== */

function centerOffset() {
  const stage = document.getElementById('pj-stage');
  const cw    = cardW();
  const unit  = cw + GAP;
  const stageW = stage.offsetWidth;
  // translate so card at pos sits at stage center
  return (stageW / 2) - (pos * unit) - (cw / 2);
}

function setTranslate(animate) {
  const x = centerOffset();
  if (!animate) {
    track.style.transition = 'none';
    track.style.transform  = `translateX(${x}px)`;
  } else {
    track.style.transition = 'transform 0.55s cubic-bezier(0.4,0,0.2,1)';
    track.style.transform  = `translateX(${x}px)`;
  }
}

function updateStyles() {
  const cards = Array.from(track.children);
  cards.forEach((card, i) => {
    const real  = parseInt(card.dataset.real);
    const isAct = real === active && i === pos;
    card.classList.toggle('pj-active', isAct);
  });

  Array.from(dotsEl.children).forEach((d, i) => d.classList.toggle('pj-dot-on', i === active));

  const p = PROJECTS[active];
  titleEl.textContent = p.title;
  descEl.textContent  = p.desc;
  tagsEl.innerHTML    = p.tags.map(t => `<span class="lm-tag">${t}</span>`).join('');
}

function silentJump() {
  // after animation, if we're in a clone zone jump silently to real zone
  if (pos < N) {
    pos += N;
    setTranslate(false);
  } else if (pos >= N * 2) {
    pos -= N;
    setTranslate(false);
  }
  locked = false;
}

/* ==================== EVENTS ==================== */

function step(dir) {
  if (locked) return;
  locked = true;

  pos    += dir;
  active  = ((active + dir) % N + N) % N;

  setTranslate(true);
  updateStyles();

  // after transition ends, silently reposition if in clone zone
  track.addEventListener('transitionend', silentJump, { once: true });
}

function jumpTo(realIdx) {
  if (realIdx === active) return;
  const dir   = realIdx > active ? 1 : -1;
  const steps = Math.abs(realIdx - active);
  let   i     = 0;
  function next() {
    if (i++ < steps) { step(dir); setTimeout(next, 580); }
  }
  next();
}

document.getElementById('pj-prev').addEventListener('click', () => step(-1));
document.getElementById('pj-next').addEventListener('click', () => step(1));

window.addEventListener('resize', () => { setTranslate(false); });

document.addEventListener('keydown', (e) => {
  const stage = document.getElementById('pj-stage');
  if (!stage) return;
  const rect = stage.getBoundingClientRect();
  if (rect.top < window.innerHeight && rect.bottom > 0) {
    if (e.key === 'ArrowLeft')  step(-1);
    if (e.key === 'ArrowRight') step(1);
  }
});

let tx = null;
document.getElementById('pj-stage').addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
document.getElementById('pj-stage').addEventListener('touchend',   e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 40) step(dx < 0 ? 1 : -1);
  tx = null;
});

.pj-modal-title  { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.02em; color: var(--c-text); }
.pj-modal-main   { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.pj-modal-img-wrap {
  position: relative; width: 100%;
  border-radius: 16px; overflow: hidden;
  background: var(--ph-base);
  aspect-ratio: 16/9;
  display: flex; align-items: center; justify-content: center;
}
.pj-modal-img {
  width: 100%; height: 100%;
  object-fit: contain;
  display: block;
  transition: opacity 0.22s;
}
.pj-modal-arr {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.18);
  color: #fff; cursor: pointer; z-index: 2;
  transition: background 0.2s, transform 0.2s;
}
.pj-modal-arr:hover { background: rgba(0,0,0,0.70); transform: translateY(-50%) scale(1.08); }
.pj-modal-arr--prev { left: 10px; }
.pj-modal-arr--next { right: 10px; }
.pj-modal-thumbs {
  display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
}
.pj-modal-thumb {
  width: 72px; height: 50px; border-radius: 10px;
  object-fit: cover; cursor: pointer;
  border: 2px solid transparent;
  opacity: 0.55;
  transition: opacity 0.2s, border-color 0.2s, transform 0.2s;
}
.pj-modal-thumb:hover  { opacity: 0.8; transform: scale(1.06); }
.pj-modal-thumb.active { opacity: 1; border-color: var(--c-accent); }
.pj-modal-counter { font-size: 0.72rem; font-weight: 600; color: var(--c-muted); letter-spacing: 0.06em; }
@media (max-width: 600px) {
  .pj-modal-box { padding: 20px 16px 18px; border-radius: 20px; }
  .pj-modal-thumb { width: 56px; height: 40px; }
}
  `;
  document.head.appendChild(style);
})();

let modalImages = [];
let modalIdx    = 0;

function openGallery(project) {
  modalImages = project.gallery;
  modalIdx    = 0;
  document.getElementById('pj-modal-title').textContent = project.title;
  renderModalImg();
  document.getElementById('pj-modal').classList.add('pj-modal-open');
  document.body.style.overflow = 'hidden';
}

function closeGallery() {
  document.getElementById('pj-modal').classList.remove('pj-modal-open');
  document.body.style.overflow = '';
}

function renderModalImg() {
  const img    = document.getElementById('pj-modal-img');
  const thumbs = document.getElementById('pj-modal-thumbs');
  const counter= document.getElementById('pj-modal-counter');

  img.style.opacity = '0';
  img.src = modalImages[modalIdx];
  img.onload = () => { img.style.opacity = '1'; };

  thumbs.innerHTML = modalImages.map((src, i) =>
    `<img class="pj-modal-thumb${i === modalIdx ? ' active' : ''}"
          src="${src}" alt="Screenshot ${i+1}"
          onclick="window._pjModalGo(${i})" loading="lazy"/>`
  ).join('');

  counter.textContent = `${modalIdx + 1} / ${modalImages.length}`;
}

window._pjModalGo = function(i) {
  modalIdx = i;
  renderModalImg();
};

document.addEventListener('click', (e) => {
  if (e.target.id === 'pj-modal-backdrop' || e.target.id === 'pj-modal-close' || e.target.closest('#pj-modal-close')) closeGallery();
  if (e.target.id === 'pj-modal-prev' || e.target.closest('#pj-modal-prev')) { modalIdx = (modalIdx - 1 + modalImages.length) % modalImages.length; renderModalImg(); }
  if (e.target.id === 'pj-modal-next' || e.target.closest('#pj-modal-next')) { modalIdx = (modalIdx + 1) % modalImages.length; renderModalImg(); }
});

document.addEventListener('keydown', (e) => {
  const modal = document.getElementById('pj-modal');
  if (!modal.classList.contains('pj-modal-open')) return;
  if (e.key === 'Escape')     closeGallery();
  if (e.key === 'ArrowLeft')  { modalIdx = (modalIdx - 1 + modalImages.length) % modalImages.length; renderModalImg(); }
  if (e.key === 'ArrowRight') { modalIdx = (modalIdx + 1) % modalImages.length; renderModalImg(); }
});

/* ==================== INIT ==================== */

buildTrack();

})();
</script>
