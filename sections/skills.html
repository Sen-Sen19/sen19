<section id="skills" class="lm-section">
  <div class="lm-orb lm-orb--3" style="bottom:10%;left:5%;width:280px;height:200px;" aria-hidden="true"></div>
  <div class="lm-orb lm-orb--1" style="top:8%;right:5%;width:200px;height:160px;" aria-hidden="true"></div>

  <div class="lm-section-inner">
    <span class="lm-eyebrow">Tech Stack</span>
    <h2 class="lm-section-title">My <span class="lm-grad-text">Skills</span></h2>

    <!-- Ring field: drag any ring, scroll away and back to replay the slide-in/out -->
    <div class="ring-field" id="ring-field">
      <div class="ring-slot" data-skill="Flutter"><img class="ring-img" src="images/ring1.png" alt="Flutter" draggable="false"/></div>
      <div class="ring-slot" data-skill="HTML / CSS / JS"><img class="ring-img" src="images/ring2.png" alt="HTML / CSS / JS" draggable="false"/></div>
      <div class="ring-slot" data-skill="MS SQL"><img class="ring-img" src="images/ring3.png" alt="MS SQL" draggable="false"/></div>
      <div class="ring-slot" data-skill="React"><img class="ring-img" src="images/ring4.png" alt="React" draggable="false"/></div>
      <div class="ring-slot" data-skill="Laravel"><img class="ring-img" src="images/ring5.png" alt="Laravel" draggable="false"/></div>
      <div class="ring-slot" data-skill="Tailwind"><img class="ring-img" src="images/ring6.png" alt="Tailwind" draggable="false"/></div>
      <div class="ring-slot" data-skill="Photoshop"><img class="ring-img" src="images/ring7.png" alt="Photoshop" draggable="false"/></div>
      <div class="ring-slot" data-skill="Canva / Figma"><img class="ring-img" src="images/ring8.png" alt="Canva / Figma" draggable="false"/></div>
      <div class="ring-slot" data-skill="PHP"><img class="ring-img" src="images/ring9.png" alt="PHP" draggable="false"/></div>
      <div class="ring-slot" data-skill="Illustrator"><img class="ring-img" src="images/ring10.png" alt="Illustrator" draggable="false"/></div>
    </div>
  </div>
</section>

<style>
  .ring-field{
    position:relative;
    width:100%;
    max-width:820px;
    aspect-ratio:3/2;
    margin-top:8px;
  }
  .ring-slot{
    position:absolute;
    left:var(--ax,50%);
    top:var(--ay,50%);
    width:11%;
    aspect-ratio:1/1;
    transform:translate(calc(-50% + var(--ex,0px)), calc(-50% + var(--ey,0px))) scale(0.82) rotate(var(--r,0deg));
    opacity:0;
    display:flex;
    cursor:pointer;
    touch-action:none;
    transition:transform 0.9s cubic-bezier(.22,1,.36,1), opacity 0.45s ease;
    transition-delay:var(--d,0s);
    will-change:transform,opacity;
  }
  .ring-field.in-view .ring-slot{
    opacity:1;
    transform:translate(-50%,-50%) scale(1) rotate(var(--r,0deg));
  }
  .ring-field.in-view .ring-slot{cursor:grab;}
  .ring-slot.dragging{transition:none;z-index:30;cursor:grabbing;}

  .ring-img{
    width:100%;height:100%;object-fit:contain;
    filter:
      drop-shadow(0 0 14px rgba(124,58,237,0.35))
      drop-shadow(0 10px 20px rgba(100,60,200,0.20));
    animation:ring-float 5s ease-in-out infinite;
    animation-delay:var(--d,0s);
    transition:filter 0.3s ease, transform 0.25s ease;
  }
  .ring-slot:hover .ring-img,
  .ring-slot.active .ring-img{transform:scale(1.08);}
  .ring-slot.dragging .ring-img{animation:none;transform:scale(1.18);}
  @keyframes ring-float{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}

  /* Dark mode: each ring glows in its own gem color */
  [data-theme="dark"] .ring-img{
    filter:
      drop-shadow(0 0 18px var(--ring-glow, rgba(160,130,255,0.55)))
      drop-shadow(0 10px 22px rgba(80,30,180,0.25));
  }
  [data-theme="dark"] .ring-slot:nth-child(1)  .ring-img{--ring-glow:rgba(178,34,34,0.7);}   /* dark red */
  [data-theme="dark"] .ring-slot:nth-child(2)  .ring-img{--ring-glow:rgba(250,204,21,0.7);}  /* yellow */
  [data-theme="dark"] .ring-slot:nth-child(3)  .ring-img{--ring-glow:rgba(154,205,50,0.7);}  /* yellow green */
  [data-theme="dark"] .ring-slot:nth-child(4)  .ring-img{--ring-glow:rgba(168,85,247,0.7);}  /* purple */
  [data-theme="dark"] .ring-slot:nth-child(5)  .ring-img{--ring-glow:rgba(255,255,255,0.6);} /* white */
  [data-theme="dark"] .ring-slot:nth-child(6)  .ring-img{--ring-glow:rgba(56,189,248,0.7);}  /* light blue */
  [data-theme="dark"] .ring-slot:nth-child(7)  .ring-img{--ring-glow:rgba(59,130,246,0.7);}  /* blue */
  [data-theme="dark"] .ring-slot:nth-child(8)  .ring-img{--ring-glow:rgba(34,197,94,0.7);}   /* green */
  [data-theme="dark"] .ring-slot:nth-child(9)  .ring-img{--ring-glow:rgba(249,115,22,0.7);}  /* orange */
  [data-theme="dark"] .ring-slot:nth-child(10) .ring-img{--ring-glow:rgba(255,255,255,0.6);} /* white */

  /* Click tooltip — pulled straight from the data-skill attribute, hidden when empty */
  .ring-slot::after{
    content:attr(data-skill);
    position:absolute;
    bottom:100%;
    left:50%;
    margin-bottom:10px;
    padding:6px 14px;
    border-radius:99px;
    font-size:0.72rem;
    font-weight:600;
    white-space:nowrap;
    background:var(--gel-bg);
    border:1px solid var(--gel-border);
    backdrop-filter:var(--gel-blur);
    -webkit-backdrop-filter:var(--gel-blur);
    box-shadow:var(--gel-shadow);
    color:var(--c-accent);
    opacity:0;
    pointer-events:none;
    transform:translate(-50%,6px) scale(0.85);
    transition:opacity 0.22s ease, transform 0.22s ease;
    z-index:5;
  }
  .ring-slot:not([data-skill])::after,
  .ring-slot[data-skill=""]::after{display:none;}
  .ring-slot.active::after{opacity:1;transform:translate(-50%,0) scale(1);}

  @media(max-width:700px){
    .ring-field{max-width:400px;}
    .ring-slot{width:15%;}
  }
  @media(prefers-reduced-motion:reduce){
    .ring-img{animation:none;}
    .ring-slot{transition:opacity 0.3s ease;}
  }
</style>

<script>
  (function(){
    function initRingField(){
      const field = document.getElementById('ring-field');
      if(!field) return;
      const slots = Array.from(field.querySelectorAll('.ring-slot'));
      const n = slots.length;

      const marginX = [10, 90];
      const marginY = [11, 87];
      const dragMarginX = [3, 97];
      const dragMarginY = [3, 96];
      const yScale  = 1.55;
      const minDist = 34; // bump this up/down to control how spread out they feel

      function randIn(range){ return range[0] + Math.random()*(range[1]-range[0]); }
      function clamp(v, range){ return Math.min(range[1], Math.max(range[0], v)); }

      // Random start + relax overlaps apart — even spread, never a grid
      const pts = [];
      for(let i=0;i<n;i++){ pts.push({x: randIn(marginX), y: randIn(marginY)}); }
      for(let iter=0; iter<80; iter++){
        for(let i=0;i<n;i++){
          for(let j=i+1;j<n;j++){
            const dx = pts[i].x - pts[j].x;
            const dy = (pts[i].y - pts[j].y) * yScale;
            let dist = Math.sqrt(dx*dx + dy*dy);
            if(dist < minDist){
              if(dist < 0.001) dist = 0.001;
              const overlap = (minDist - dist) / 2;
              const ux = dx/dist, uy = (dy/dist)/yScale;
              pts[i].x += ux*overlap*0.5; pts[i].y += uy*overlap*0.5;
              pts[j].x -= ux*overlap*0.5; pts[j].y -= uy*overlap*0.5;
            }
          }
        }
        pts.forEach(p=>{ p.x = clamp(p.x, marginX); p.y = clamp(p.y, marginY); });
      }

      // Recomputes the slide-in/out direction for a slot based on wherever it currently sits
      function setExitVector(slot, ax, ay){
        const rect = field.getBoundingClientRect();
        const fw = rect.width || 820, fh = rect.height || fw*(2/3);
        const cx = fw/2, cy = fh/2;
        const px = (ax/100)*fw, py = (ay/100)*fh;
        let vx = px-cx, vy = py-cy;
        const len = Math.sqrt(vx*vx+vy*vy);
        if(len < 1){ const a = Math.random()*Math.PI*2; vx = Math.cos(a); vy = Math.sin(a); }
        else { vx/=len; vy/=len; }
        const flyDist = Math.max(fw, fh)*0.9 + 220;
        slot.style.setProperty('--ex', (vx*flyDist).toFixed(1)+'px');
        slot.style.setProperty('--ey', (vy*flyDist).toFixed(1)+'px');
      }

      slots.forEach((slot, i)=>{
        const pos = pts[i];
        slot.style.setProperty('--ax', pos.x.toFixed(2)+'%');
        slot.style.setProperty('--ay', pos.y.toFixed(2)+'%');
        setExitVector(slot, pos.x, pos.y);
        slot.style.setProperty('--r', (Math.random()*28-14).toFixed(1)+'deg');
        slot.style.setProperty('--d', (i*0.05 + Math.random()*0.35).toFixed(2)+'s');

        let dragging=false, moved=false, startX=0, startY=0, startAx=0, startAy=0, rect=null;

        slot.addEventListener('pointerdown', (e)=>{
          e.stopPropagation();
          if(!field.classList.contains('in-view')) return;
          dragging = true; moved = false;
          startX = e.clientX; startY = e.clientY;
          startAx = parseFloat(slot.style.getPropertyValue('--ax')) || 50;
          startAy = parseFloat(slot.style.getPropertyValue('--ay')) || 50;
          rect = field.getBoundingClientRect();
          slot.classList.add('dragging');
          slot.setPointerCapture(e.pointerId);
        });

        slot.addEventListener('pointermove', (e)=>{
          if(!dragging) return;
          const dx = e.clientX - startX, dy = e.clientY - startY;
          if(Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
          const newAx = clamp(startAx + (dx/rect.width)*100, dragMarginX);
          const newAy = clamp(startAy + (dy/rect.height)*100, dragMarginY);
          slot.style.setProperty('--ax', newAx.toFixed(2)+'%');
          slot.style.setProperty('--ay', newAy.toFixed(2)+'%');
        });

        function endDrag(e){
          if(!dragging) return;
          dragging = false;
          slot.classList.remove('dragging');
          try{ slot.releasePointerCapture(e.pointerId); }catch(_){}
          const ax = parseFloat(slot.style.getPropertyValue('--ax')) || 50;
          const ay = parseFloat(slot.style.getPropertyValue('--ay')) || 50;
          setExitVector(slot, ax, ay); // so it slides out from wherever it was dropped
          if(!moved){
            if(!slot.hasAttribute('data-skill') || slot.getAttribute('data-skill')==='') return;
            const wasActive = slot.classList.contains('active');
            slots.forEach(s=>s.classList.remove('active'));
            if(!wasActive) slot.classList.add('active');
          }
        }
        slot.addEventListener('pointerup', endDrag);
        slot.addEventListener('pointercancel', endDrag);
      });

      document.addEventListener('pointerdown', ()=>{
        slots.forEach(s=>s.classList.remove('active'));
      });

      // Toggle (not disconnect) — scrolling away slides them back out, scrolling back replays the entrance
      const io = new IntersectionObserver((entries)=>{
        entries.forEach(entry=>{
          field.classList.toggle('in-view', entry.isIntersecting);
        });
      }, {threshold:0.2});
      io.observe(field);
    }

    if(document.readyState==='loading'){
      document.addEventListener('DOMContentLoaded', initRingField);
    } else {
      initRingField();
    }
  })();
</script>
