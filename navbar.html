<style>
:root {
  --lq-accent-hi:   #7C3AED;
  --lq-accent-lo:   #0EA5E9;
  --lq-accent-mid:  #6366F1;
  --lq-bg:          rgba(255,255,255,0.55);
  --lq-bg-mobile:   rgba(255,255,255,0.92);
  --lq-border:      rgba(120,80,220,0.18);
  --lq-shadow:      0 8px 32px rgba(100,60,200,0.10), 0 1px 0 rgba(255,255,255,0.6) inset;
  --lq-text:        #1a1033;
  --lq-text-muted:  #6b7280;
  --lq-link-hover:  #7C3AED;
  --lq-blob-a:      rgba(124,58,237,0.12);
  --lq-blob-b:      rgba(14,165,233,0.10);
  --lq-thumb-bg:    #fff;
  --lq-track-bg:    rgba(124,58,237,0.15);
  --lq-track-active:linear-gradient(135deg,var(--lq-accent-hi),var(--lq-accent-lo));
  --lq-burger-color:#7C3AED;
  --lq-transition:  0.3s cubic-bezier(0.4,0,0.2,1);
  --lq-radius:      18px;
  --lq-radius-sm:   10px;
}

[data-theme="dark"] {
  --lq-bg:          rgba(15,10,30,0.70);
  --lq-bg-mobile:   rgba(18,12,38,0.98);
  --lq-border:      rgba(139,92,246,0.22);
  --lq-shadow:      0 8px 40px rgba(80,30,180,0.25), 0 1px 0 rgba(255,255,255,0.04) inset;
  --lq-text:        #ede9fe;
  --lq-text-muted:  #a78bfa;
  --lq-link-hover:  #ff6b6b;
  --lq-blob-a:      rgba(241,0,0,0.18);
  --lq-blob-b:      rgba(185,28,28,0.12);
  --lq-thumb-bg:    #1e1040;
  --lq-track-bg:    rgba(139,92,246,0.20);
  --lq-burger-color:#ff6b6b;
  --lq-accent-hi:   #f10000;
  --lq-accent-lo:   #8b0000;
  --lq-accent-mid:  #cc0000;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

/* ── Nav shell ── */
.lq-nav {
  position:fixed;top:16px;left:50%;transform:translateX(-50%);
  width:min(92vw,1080px);z-index:1000;
  border-radius:var(--lq-radius);
  background:var(--lq-bg);border:1px solid var(--lq-border);
  box-shadow:var(--lq-shadow);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  overflow:hidden;
  transition:background var(--lq-transition),border-color var(--lq-transition),box-shadow var(--lq-transition);
  animation:lq-slide-down 0.55s cubic-bezier(0.34,1.56,0.64,1) both;
}

/* ── Blobs ── */
.lq-blob{position:absolute;border-radius:50%;filter:blur(28px);pointer-events:none;animation:lq-float 8s ease-in-out infinite;will-change:transform;}
.lq-blob--a{width:200px;height:120px;background:var(--lq-blob-a);top:-40px;left:-40px;}
.lq-blob--b{width:160px;height:100px;background:var(--lq-blob-b);top:-30px;right:-20px;animation-delay:-4s;}
@keyframes lq-float{0%,100%{transform:translate(0,0) scale(1);}33%{transform:translate(12px,6px) scale(1.05);}66%{transform:translate(-8px,4px) scale(0.97);}}

/* ── Inner row ── */
.lq-nav__inner {
  position:relative;z-index:1;
  display:flex;align-items:center;
  padding:10px 18px;gap:8px;
}

/* ── Logo ── */
.lq-logo{display:flex;align-items:center;text-decoration:none;color:var(--lq-text);flex-shrink:0;transition:opacity var(--lq-transition);}
.lq-logo:hover{opacity:0.8;}
.lq-logo__name{font-family:'Inter','Segoe UI',system-ui,sans-serif;font-weight:800;font-size:1.1rem;letter-spacing:-0.02em;line-height:1;}
.lq-logo__dot{color:var(--lq-accent-hi);}

/* ── Desktop links ── */
.lq-links{display:flex;align-items:center;gap:2px;list-style:none;margin:0 auto;padding:0;}
.lq-link{
  position:relative;display:inline-block;padding:7px 13px;
  font-family:'Inter','Segoe UI',system-ui,sans-serif;font-size:0.875rem;font-weight:500;
  color:var(--lq-text-muted);text-decoration:none;border-radius:var(--lq-radius-sm);
  transition:color var(--lq-transition);overflow:hidden;white-space:nowrap;
}
.lq-link::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(124,58,237,0.10),rgba(14,165,233,0.08));border-radius:inherit;opacity:0;transition:opacity var(--lq-transition);}
.lq-link::after{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%) scaleX(0);width:calc(100% - 24px);height:2px;border-radius:2px;background:linear-gradient(90deg,var(--lq-accent-hi),var(--lq-accent-lo));transition:transform var(--lq-transition);transform-origin:center;}
.lq-link:hover{color:var(--lq-link-hover);}
.lq-link:hover::before{opacity:1;}
.lq-link:hover::after,.lq-link.active::after{transform:translateX(-50%) scaleX(1);}
.lq-link.active{color:var(--lq-link-hover);}

/* ── Controls ── */
.lq-controls{display:flex;align-items:center;gap:10px;flex-shrink:0;margin-left:auto;}

/* ── Theme toggle ── */
.lq-theme-btn{display:flex;align-items:center;gap:7px;background:none;border:none;cursor:pointer;padding:0;color:var(--lq-text-muted);font-family:inherit;}
.lq-theme-btn__track{position:relative;display:flex;align-items:center;width:48px;height:26px;border-radius:99px;background:var(--lq-track-bg);border:1px solid var(--lq-border);transition:background var(--lq-transition),border-color var(--lq-transition);overflow:hidden;flex-shrink:0;}
.lq-theme-btn__track::before{content:'';position:absolute;inset:0;background:var(--lq-track-active);opacity:0;transition:opacity var(--lq-transition);border-radius:inherit;}
[data-theme="dark"] .lq-theme-btn__track::before{opacity:1;}
.lq-theme-btn__thumb{position:absolute;left:3px;width:20px;height:20px;border-radius:50%;background:var(--lq-thumb-bg);box-shadow:0 1px 4px rgba(0,0,0,0.18);display:flex;align-items:center;justify-content:center;transition:transform var(--lq-transition),background var(--lq-transition);z-index:1;}
[data-theme="dark"] .lq-theme-btn__thumb{transform:translateX(22px);}
.lq-icon{width:12px;height:12px;position:absolute;transition:opacity var(--lq-transition),transform var(--lq-transition);}
.lq-icon--sun{color:var(--lq-accent-hi);opacity:1;transform:scale(1);}
.lq-icon--moon{color:#c4b5fd;opacity:0;transform:scale(0.6);}
[data-theme="dark"] .lq-icon--sun{opacity:0;transform:scale(0.6);}
[data-theme="dark"] .lq-icon--moon{opacity:1;transform:scale(1);}
.lq-theme-btn__label{font-size:0.78rem;font-weight:500;color:var(--lq-text-muted);white-space:nowrap;}

/* ── CTA ── */
.lq-cta{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:99px;background:linear-gradient(135deg,var(--lq-accent-hi),var(--lq-accent-lo));color:#fff;font-family:'Inter','Segoe UI',system-ui,sans-serif;font-size:0.82rem;font-weight:600;text-decoration:none;white-space:nowrap;box-shadow:0 4px 14px rgba(124,58,237,0.32),0 1px 0 rgba(255,255,255,0.15) inset;transition:transform var(--lq-transition),box-shadow var(--lq-transition),filter var(--lq-transition);position:relative;overflow:hidden;}
.lq-cta::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.2),transparent);opacity:0;transition:opacity var(--lq-transition);}
.lq-cta:hover{transform:translateY(-1px);filter:brightness(1.05);}
.lq-cta:hover::before{opacity:1;}
.lq-cta svg{transition:transform var(--lq-transition);}
.lq-cta:hover svg{transform:translateX(2px);}

/* ── Burger ── */
.lq-burger{display:none;flex-direction:column;justify-content:center;align-items:center;gap:5px;width:36px;height:36px;background:none;border:none;cursor:pointer;padding:4px;border-radius:var(--lq-radius-sm);transition:background var(--lq-transition);flex-shrink:0;}
.lq-burger:hover{background:rgba(124,58,237,0.08);}
.lq-burger__bar{display:block;width:20px;height:2px;background:var(--lq-burger-color);border-radius:2px;transition:transform var(--lq-transition),opacity var(--lq-transition);transform-origin:center;}
.lq-burger[aria-expanded="true"] .lq-burger__bar:nth-child(1){transform:translateY(7px) rotate(45deg);}
.lq-burger[aria-expanded="true"] .lq-burger__bar:nth-child(2){opacity:0;transform:scaleX(0);}
.lq-burger[aria-expanded="true"] .lq-burger__bar:nth-child(3){transform:translateY(-7px) rotate(-45deg);}

/* ── Mobile menu ── */
.lq-mobile-menu{
  display:none;flex-direction:column;gap:4px;
  padding:0 12px;
  border-top:1px solid var(--lq-border);
  background:var(--lq-bg-mobile);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  max-height:0;overflow:hidden;
  transition:max-height 0.4s cubic-bezier(0.4,0,0.2,1),padding var(--lq-transition);
}
.lq-mobile-menu.open{max-height:480px;padding:12px 12px 18px;}
.lq-mobile-links{list-style:none;display:flex;flex-direction:column;gap:2px;}
.lq-mobile-link{
  display:block;padding:12px 14px;
  font-family:'Inter','Segoe UI',system-ui,sans-serif;font-size:1rem;font-weight:500;
  color:var(--lq-text);text-decoration:none;border-radius:var(--lq-radius-sm);
  transition:background var(--lq-transition),color var(--lq-transition);
}
.lq-mobile-link:hover{background:rgba(124,58,237,0.08);color:var(--lq-link-hover);}
.lq-cta--mobile{margin-top:10px;justify-content:center;width:100%;}

/* ── Scrolled state ── */
.lq-nav.scrolled{box-shadow:0 12px 40px rgba(80,30,180,0.14),0 1px 0 rgba(255,255,255,0.5) inset;}
[data-theme="dark"] .lq-nav.scrolled{box-shadow:0 12px 40px rgba(80,30,180,0.30),0 1px 0 rgba(255,255,255,0.04) inset;}

/* ── Animations ── */
@keyframes lq-slide-down{
  from{transform:translateX(-50%) translateY(-120%);opacity:0;}
  to{transform:translateX(-50%) translateY(0);opacity:1;}
}

/* ── Responsive breakpoints ── */

/* Tablet: hide label, keep links */
@media(max-width:900px){
  .lq-theme-btn__label{display:none;}
}

/* Mobile: hide links, show burger */
@media(max-width:640px){
  .lq-links{display:none;}
  .lq-cta--desktop{display:none;}
  .lq-burger{display:flex;}
  .lq-mobile-menu{display:flex;}
  .lq-nav__inner{padding:8px 14px;}
}

/* Small mobile: tighten further */
@media(max-width:380px){
  .lq-logo__name{font-size:0.95rem;}
  .lq-nav{top:10px;width:96vw;}
}

@media(prefers-reduced-motion:reduce){
  .lq-nav,.lq-blob{animation:none!important;}
  *,*::before,*::after{transition-duration:0.01ms!important;}
}
</style>

<script>
(function () {
  const nav        = document.getElementById('lq-nav');
  const themeBtn   = document.getElementById('lq-theme-btn');
  const label      = themeBtn?.querySelector('.lq-theme-btn__label');
  const burger     = document.getElementById('lq-burger');
  const mobileMenu = document.getElementById('lq-mobile-menu');
  const STORAGE_KEY = 'lq-theme';

  function syncLabel() {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    if (themeBtn) themeBtn.setAttribute('aria-pressed', String(isDark));
    if (label) label.textContent = isDark ? 'Light' : 'Dark';
  }

  syncLabel();

  const themeObserver = new MutationObserver(syncLabel);
  themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  themeBtn?.addEventListener('click', () => {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const next = isDark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem(STORAGE_KEY, next);
  });

  function onScroll() {
    nav?.classList.toggle('scrolled', window.scrollY > 24);
    highlightActive();
  }
  window.addEventListener('scroll', onScroll, { passive: true });

  const links = document.querySelectorAll('.lq-link');
  function highlightActive() {
    const scrollY = window.scrollY + 120;
    let current = 0;
    links.forEach((a, i) => {
      const id = a.getAttribute('href')?.replace('#', '');
      const sec = id ? document.getElementById(id) : null;
      if (sec && sec.offsetTop <= scrollY) current = i;
    });
    links.forEach((a, i) => a.classList.toggle('active', i === current));
  }

  function closeMobile() {
    burger?.setAttribute('aria-expanded', 'false');
    mobileMenu?.classList.remove('open');
    mobileMenu?.setAttribute('aria-hidden', 'true');
  }

  burger?.addEventListener('click', () => {
    const expanded = burger.getAttribute('aria-expanded') === 'true';
    burger.setAttribute('aria-expanded', String(!expanded));
    mobileMenu?.classList.toggle('open', !expanded);
    mobileMenu?.setAttribute('aria-hidden', String(expanded));
  });

  document.querySelectorAll('.lq-mobile-link, .lq-cta--mobile').forEach(a => {
    a.addEventListener('click', closeMobile);
  });

  document.addEventListener('click', e => {
    if (!nav?.contains(e.target)) closeMobile();
  });
})();
</script>
